<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bewell Studio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .menu-bar {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      list-style: none;
      margin: 0;
      padding: 1rem;
      background: #0f172a;
    }

    .menu-bar a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }

    main {
      padding: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <nav aria-label="Main navigation">
    <ul class="menu-bar">
      <li><a href="#home">Home</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>
  <main>
    <section id="home">
      <h1>Welcome to Bewell Studio</h1>
      <p>A basic website with a menu bar across the top.</p>
    </section>
    <section id="services">
      <h2>Services</h2>
      <p>Explore our wellness and studio offerings.</p>
    </section>
    <section id="about">
      <h2>About</h2>
      <p>Learn more about our mission and team.</p>
    </section>
    <section id="contact">
      <h2>Contact</h2>
      <p>Reach out to us for bookings and questions.</p>
    </section>
  </main>
</body>
</html>
